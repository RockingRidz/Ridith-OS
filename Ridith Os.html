<!DOCTYPE html>
<html>
<head>
    <title>Ridith OS</title>
    <style>
        body {
            /* Full screen cosmic background */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* The OS Window box */
        .window {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 400px;
            text-align: center;
        }

        .window h1 {
            margin-top: 0;
            color: #111;
            font-size: 24px;
        }

        .window p {
            color: #444;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="window">
        <h1>Welcome To Ridith OS!!</h1>
        <p>This is an operating system completely handmade, built, and designed by Ridith Shetty.</p>
        <h2>Tell me what do you think!!</h2>
    </div>

</body>
</html>
