<!DOCTYPE html>
<html>
<head>
    <title>Ridith OS</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809');
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Noto Sans, system-ui, sans-serif;
            overflow: hidden;
        }

        /* Top Bar Styling */
        #top {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            backdrop-filter: blur(10px);
            background-color: rgba(0, 0, 0, 0.125);
            color: #fff;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 1000;
        }

        #top p {
            margin-left: 16px;
            margin-right: 16px;
            background-color: rgba(256, 256, 256, 0.125);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 14px;
        }

        /* Desktop Apps Container & Icons */
        #desktopApps {
            padding-top: 64px;
            padding-left: 16px;
        }

        .app-icon {
            text-align: center;
            padding: 16px;
            filter: drop-shadow(0 0 8px black);
            width: fit-content;
            cursor: pointer;
            user-select: none;
        }

        .app-icon img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
        }

        .app-icon p {
            margin: 0px;
            color: #fff;
            font-size: 14px;
            margin-top: 4px;
        }

        /* Window Structure */
        .window {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: absolute;
            overflow: hidden;
        }

        .windowheader {
            background-color: #333;
            color: white;
            padding: 8px 12px;
            cursor: grab;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .closebutton {
            cursor: pointer;
            width: 16px;
            height: 16px;
            background-color: #ff5f56;
            border-radius: 50%;
        }

        .headertext {
            margin: 0;
        }

        /* Welcome Window */
        #welcome {
            width: 400px;
            top: calc(50% - 90px);
            left: calc(50% - 180px);
        }

        /* Notes App Window */
        #notes {
            width: 520px;
            display: none;
            top: calc(50% - 240px);
            left: calc(50% - 260px);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div id="top">
        <p id="welcomeopen" style="font-weight: 700; cursor: pointer;">RidithOS</p>
        <p id="timeElement">Time</p>
    </div>

    <!-- Desktop Apps / Icons -->
    <div id="desktopApps">
        <div class="app-icon" id="notesIcon">
            <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" alt="Notes Icon">
            <p>Hacker Notes</p>
        </div>
    </div>

    <!-- Welcome Window -->
    <div class="window" id="welcome">
        <div class="windowheader" id="welcomeheader">
            <div class="closebutton" id="welcomeclose"></div>
            <p class="headertext">Welcome Window</p>
            <div style="width: 16px;"></div>
        </div>
        <div style="padding: 20px; text-align: center;">
            <h1 style="margin-top: 0; font-size: 24px;">Welcome To Ridith OS!!</h1>
            <p style="color: #444; font-size: 14px; line-height: 1.5;">This is an operating system completely handmade and designed by Me!!</p>
        </div>
    </div>

    <!-- Notes App Window -->
    <div class="window" id="notes">
        <div class="windowheader" id="notesheader">
            <div class="closebutton" id="notesclose"></div>
            <p class="headertext">Notes</p>
            <div style="width: 16px;"></div>
        </div>
        <div style="background-color: #fff; margin: 6px; border-radius: 12px; height: 440px; padding: 16px; font-family: Courier, monospace; display: flex;">
            <!-- Sidebar for dynamic note listing -->
            <div id="sidebar" style="background-color: #F9F9F9; width: 150px; margin-right: 16px; padding: 12px; border-radius: 12px; overflow-y: auto;">
            </div>
            <!-- Main Content Area -->
            <div id="notecontent" style="flex: 1; overflow-y: auto; padding: 8px;">
                <p>Select a note from the sidebar!</p>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>

</body>
</html>
