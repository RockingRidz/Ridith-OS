<!DOCTYPE html>
<html>
<head>
    <title>Ridith OS</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Top Bar Styling */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            backdrop-filter: blur(10px);
            background-color: rgba(0, 0, 0, 0.25);
            color: #fff;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 1000;
        }

        .top-bar p {
            margin-left: 16px;
            margin-right: 16px;
            background-color: rgba(256, 256, 256, 0.125);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 14px;
        }

        /* Desktop Apps Grid */
        #desktopApps {
            padding-top: 64px;
            padding-left: 16px;
        }

        .app-icon {
            text-align: center;
            padding: 16px;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5));
            width: fit-content;
            cursor: pointer;
            user-select: none;
        }

        .app-icon img {
            width: 64px;
            height: 64px;
            border-radius: 16px;
        }

        .app-icon p {
            margin: 0px;
            color: #fff;
            font-size: 14px;
            margin-top: 4px;
        }

        /* General Window Box Styling */
        .window {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: absolute;
            overflow: hidden;
        }

        /* Window Header Bar for Dragging */
        .window-header {
            background-color: #333;
            color: white;
            padding: 8px 12px;
            cursor: grab;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .close-btn {
            cursor: pointer;
            color: #ff6b6b;
            padding: 0 4px;
        }

        /* Welcome Window Specifics */
        #welcome {
            width: 400px;
            top: calc(50% - 150px);
            left: calc(50% - 200px);
        }

        .welcome-content {
            padding: 20px;
            text-align: center;
        }

        /* Notes Window Specifics */
        #notes {
            width: 520px;
            display: none;
            top: calc(50% - 240px);
            left: calc(50% - 260px);
        }
    </style>
</head>
<body>

    <!-- Top Bar with OS Name and Live Clock -->
    <div class="top-bar">
        <p id="welcomeopen" style="font-weight: 700; cursor: pointer;">RidithOS</p>
        <p id="timeElement">Time</p>
    </div>

    <!-- Desktop Icons -->
    <div id="desktopApps">
        <div class="app-icon" id="notesIcon">
            <img src="./notebook.png" alt="Notes Icon">
            <p>Hacker Notes</p>
        </div>
    </div>

    <!-- Main Welcome Window Container -->
    <div class="window" id="welcome">
        <div class="window-header" id="welcomeheader">
            <span>Welcome Window</span>
            <span class="close-btn" id="welcomeclose">[X]</span>
        </div>
        <div class="welcome-content">
            <h1 style="margin-top: 0; font-size: 24px;">Welcome To Ridith OS!!</h1>
            <p style="color: #444; font-size: 14px; line-height: 1.5;">This is an operating system completely handmade, built, and designed by Ridith Shetty.</p>
        </div>
    </div>

    <!-- Notes App Window Container -->
    <div class="window" id="notes">
        <div class="window-header" id="notesheader">
            <span>Hacker Notes</span>
            <span class="close-btn" id="notesclose">[X]</span>
        </div>
        <div style="background-color: #fff; margin: 6px; border-radius: 12px; height: 440px; padding: 16px; font-family: Courier, monospace; display: flex;">
            <!-- Sidebar for dynamic content selection -->
            <div id="sidebar" style="background-color: #F9F9F9; width: 150px; margin-right: 16px; padding: 12px; border-radius: 12px; overflow-y: auto;">
                <!-- Filled via JS -->
            </div>
            <!-- Main Content Area -->
            <div id="notecontent" style="flex: 1; overflow-y: auto; padding: 8px;">
                <p>Select a note from the sidebar!</p>
            </div>
        </div>
    </div>

    <!-- External Script File -->
    <script src="script.js"></script>

</body>
</html>
