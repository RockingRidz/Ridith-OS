<!DOCTYPE html>
<html>
<head>
    <title>Ridith OS</title>
    <style>
       <body>

    <!-- Top Bar with OS Name and Live Clock -->
    <div class="top-bar">
        <p style="font-weight: 700;" id="welcomeopen" style="cursor: pointer;">RidithOS</p>
        <p id="timeElement">Time</p>
    </div>

    <!-- Main Window Container with Drag Handle -->
    <div class="window" id="welcome" style="top: 50%; left: 50%; transform: translate(-50%, -50%); position: absolute;">
        <div id="welcomeheader" style="cursor: grab; user-select: none; background: #333; color: white; padding: 5px; border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <span>Drag Handle</span>
            <span id="welcomeclose" style="cursor: pointer; color: #ff6b6b; font-weight: bold; padding: 0 5px;">[X]</span>
        </div>
        
        <div style="padding: 20px; text-align: center;">
            <h1>Welcome To Ridith OS!!</h1>
            <p>This is an operating system completely handmade, built, and designed by Ridith Shetty.</p>
            <h2>Tell me what do you think!!</h2>
        </div>
    </div>

    <!-- JavaScript to Update the Clock Every Second -->
    <script>
        function updateTime() {
            var currentTime = new Date().toLocaleString();
            var timeText = document.querySelector("#timeElement");
            timeText.innerHTML = currentTime;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

    <!-- Connect your external script file -->
    <script src="script.js"></script>

</body>
